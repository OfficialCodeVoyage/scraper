[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scout"
version = "0.1.0"
description = "Find what people post on Reddit, YouTube, X, Threads, Hacker News, GitHub, Bluesky and Wikipedia, under a daily credit cap."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "OfficialCodeVoyage" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "jinja2>=3.1",
    "pyyaml>=6",
    "platformdirs>=4",
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "pyright>=1.1.380"]

[project.scripts]
scout = "scout.cli:main"
scout-mcp = "scout.mcp_server:main"

[project.urls]
Homepage = "https://github.com/OfficialCodeVoyage/scraper"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
