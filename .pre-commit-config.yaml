# Install once per clone: `pre-commit install` (needs `gitleaks` on PATH, e.g. `brew install gitleaks pre-commit`).
# It scans only what is staged. Never bypass the hook: a finding is either a real secret (unstage it, rotate it) or
# a false positive (add its fingerprint to .gitleaksignore).
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false
